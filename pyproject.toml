[project]
name = "eastwalk"
version = "0.1.0"
description = "Walk east from home, one real step at a time."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "garminconnect>=0.3.17",
]

[project.scripts]
eastwalk = "eastwalk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eastwalk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
